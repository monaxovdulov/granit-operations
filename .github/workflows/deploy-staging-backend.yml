name: Deploy backend main to staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: granit-operations-staging-backend
  cancel-in-progress: false

jobs:
  checks:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact push SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify staging release gates
        run: python3 -m unittest discover -s deploy/staging -p 'test_*.py'

      - name: Run repository tests
        run: npm test

      - name: Build backend and manager
        run: npm run build

  deploy:
    name: Deploy exact SHA
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: staging
    steps:
      - name: Validate deployment bindings
        env:
          STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: |
          case "$STAGING_DEPLOY_HOST" in
            ''|*[!A-Za-z0-9.-]*|[!A-Za-z0-9]*) exit 1 ;;
          esac
          case "$STAGING_DEPLOY_USER" in
            ''|*[!a-z0-9_-]*|[!a-z_]*) exit 1 ;;
          esac

      - name: Install ephemeral SSH identity
        env:
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > "$HOME/.ssh/staging_deploy"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/staging_deploy"

      - name: Deploy current operations main
        env:
          STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/staging_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_DEPLOY_USER@$STAGING_DEPLOY_HOST" \
            "granit-deploy operations-staging $GITHUB_SHA"
